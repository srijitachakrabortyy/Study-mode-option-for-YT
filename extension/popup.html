<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      background: #0f0f13;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
    }
    h3 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #00e676;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      background: rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 8px;
    }
    select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      background: #18181f;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h3>🎓 YouTube Study Mode</h3>
  <div class="toggle-row">
    <span>Filter Recommendation Bias</span>
    <input type="checkbox" id="studyModeToggle" checked>
  </div>
  <div style="margin-top: 10px;">
    <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px;">Target Exam Syllabus:</label>
    <select id="examSelect">
      <option value="jee">JEE Main & Advanced</option>
      <option value="upsc">UPSC CSE Civil Services</option>
      <option value="neet">NEET UG Medical</option>
      <option value="gate">GATE CS & IT</option>
    </select>
  </div>
  <p style="font-size: 11px; color: #64748b; margin-top: 14px; text-align: center;">
    Removes clickbait, shorts & non-syllabus recommendations live on youtube.com
  </p>
  <script src="popup.js"></script>
</body>
</html>
